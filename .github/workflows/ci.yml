name: Core and project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Test shared logic
        env:
          TIDE_ISLAND_TEST_TMPDIR: ${{ runner.temp }}/tide-island-tests
        run: |
          set -o pipefail
          tide_test_status=0
          swift test 2>&1 | tee "$RUNNER_TEMP/tide-island-swift-test.log" || tide_test_status=$?
          python3 - "$tide_test_status" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          tide_log = Path(os.environ["RUNNER_TEMP"]) / "tide-island-swift-test.log"
          lines = tide_log.read_text().splitlines()
          if sys.argv[1] == "0":
              counts = [int(value) for value in re.findall(r"Test run with (\d+) tests? passed", "\n".join(lines))]
              declared = sum(len(re.findall(r"(?m)^\s*@Test\b", path.read_text()))
                             for path in Path("Tests/TideIslandCoreTests").rglob("*.swift"))
              assert counts and declared > 0 and max(counts) >= declared, "Missing or incomplete Swift Testing summary"
              print(f"::notice title=Shared logic tests::Tests executed: {max(counts)}; declared functions: {declared}.")
          else:
              excerpts = []
              for index, line in enumerate(lines):
                  if "error:" in line or "Expectation failed" in line or "✘ Test" in line:
                      excerpts.extend(lines[index:index + 3])
              text = "\n".join(excerpts or lines[-60:])[:24000]
              for index in range(0, len(text), 3000):
                  escaped = text[index:index + 3000].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
                  print("::error title=Shared logic test diagnostics::" + escaped)
          PY
          exit "$tide_test_status"
      - name: Build event bridge
        run: swift build --product tide-island-bridge
      - name: Exercise event bridge
        run: python3 scripts/check-bridge.py --temporary-root "${{ runner.temp }}"
      - name: Exercise hook configuration management
        run: python3 scripts/check-hooks.py --temporary-root "${{ runner.temp }}"
      - name: Exercise deterministic event replay
        run: python3 scripts/check-replay.py --temporary-root "${{ runner.temp }}"
      - name: Exercise inbox maintenance
        run: python3 scripts/check-inbox.py --temporary-root "${{ runner.temp }}"
      - name: Check native project structure
        run: python3 scripts/check-project.py
